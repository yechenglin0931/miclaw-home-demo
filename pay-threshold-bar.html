<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><title>对话内阈值横幅</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:"MiSans",-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;font-weight:330;background:#fff;padding:0}
.xu-flow{max-width:824px;width:100%;padding:0 12px;margin:0 auto;font-size:16px;padding-top:24px;padding-bottom:8px}
.xu-flow-item{margin-top:13px}
.xu-user{display:flex;justify-content:flex-end}
.xu-user-content{max-width:min(720px,86%);padding:10px 15px;line-height:1.5;border-radius:10px;background:rgba(52,130,255,0.1);color:#000}
.xu-answer{display:flex;justify-content:flex-start}
.xu-answer-content{max-width:min(824px,100%);border-radius:10px;background:#fff;color:rgba(0,0,0,0.88);line-height:1.5;padding:10px 15px}
.threshold-bar{display:flex;align-items:center;gap:10px;padding:8px 16px;margin:0 12px;background:linear-gradient(90deg,rgba(255,187,15,0.08),rgba(255,187,15,0.03));border:1px solid rgba(255,187,15,0.3);border-radius:10px;font-size:13px;color:#92600a}
.threshold-bar-action{font-size:12px;color:#3482ff;font-weight:500;cursor:pointer;white-space:nowrap}
.threshold-bar-close{width:18px;height:18px;border-radius:4px;border:none;background:none;color:rgba(0,0,0,0.3);cursor:pointer;font-size:14px}
.input-area{padding:12px 16px 16px;border-top:1px solid rgba(0,0,0,0.04)}
.input-box{display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:12px;border:1px solid #e0e5ec;background:#fff;font-size:14px;color:rgba(0,0,0,0.4)}
</style>
</head><body>
<div class="xu-flow">
  <div class="xu-flow-item"><div class="xu-user"><div class="xu-user-content">帮我写一段会议纪要</div></div></div>
  <div class="xu-flow-item"><div class="xu-answer"><div class="xu-answer-content">好的，我来帮你整理会议纪要。请问会议的主题是什么？有哪些参会人员？</div></div></div>
</div>
<div class="threshold-bar">
  <span>⚡</span>
  <span style="flex:1">积分即将用完（剩余 18%），升级获取更多额度</span>
  <span class="threshold-bar-action">升级会员</span>
  <button class="threshold-bar-close">×</button>
</div>
<div class="input-area"><div class="input-box"><span>输入消息...</span></div></div>
</body></html>
