<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>对话内阈值横幅</title>
<style>
:root { --text: #1c1f28; --text-muted: #636878; --accent: #3482ff; --border: #e9ebf0; }
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'MiSans', -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif; font-weight: 330; line-height: 1.6; color: var(--text); background: #fff; -webkit-font-smoothing: antialiased; padding: 32px; }
.scene-label { text-align: center; padding: 8px; font-size: 11px; color: rgba(0,0,0,0.35); background: rgba(0,0,0,0.02); border-radius: 6px; margin-bottom: 16px; margin-top: 24px; }
.scene-label:first-child { margin-top: 0; }

body { background: #fff; padding: 0; max-width: 700px; margin: 0 auto; }
.chat { padding: 24px 24px 8px; }
.user { display: flex; justify-content: flex-end; margin-bottom: 16px; }
.user-bubble { padding: 10px 15px; border-radius: 10px; background: rgba(52,130,255,0.1); font-size: 16px; max-width: 80%; }
.answer { padding: 10px 15px; border-radius: 10px; background: #fff; font-size: 16px; color: rgba(0,0,0,0.88); margin-bottom: 16px; }
.threshold-bar { display: flex; align-items: center; gap: 10px; padding: 8px 16px; margin: 0 24px; background: linear-gradient(90deg, rgba(255,187,15,0.08), rgba(255,187,15,0.03)); border: 1px solid rgba(255,187,15,0.3); border-radius: 10px; font-size: 13px; color: #92600a; }
.bar-action { font-size: 12px; color: var(--accent); font-weight: 500; cursor: pointer; white-space: nowrap; }
.bar-close { width: 18px; height: 18px; border: none; background: none; color: rgba(0,0,0,0.3); cursor: pointer; font-size: 14px; }
.input-area { padding: 12px 24px 16px; border-top: 1px solid rgba(0,0,0,0.04); }
.input-box { display: flex; align-items: center; padding: 12px 16px; border-radius: 12px; border: 1px solid #e0e5ec; font-size: 14px; color: rgba(0,0,0,0.35); }
</style></head><body>
<div class="chat">
  <div class="user"><div class="user-bubble">帮我写一段会议纪要</div></div>
  <div class="answer">好的，我来帮你整理会议纪要。请问会议的主题是什么？有哪些参会人员？主要讨论了哪些议题？</div>
</div>
<div class="threshold-bar">
  <span>⚡</span>
  <span style="flex:1">本月积分剩余不足 20%，升级可获取更多积分</span>
  <span class="bar-action">升级标准会员</span>
  <button class="bar-close">×</button>
</div>
<div class="input-area"><div class="input-box">输入消息...</div></div>
</body></html>
