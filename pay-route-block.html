<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><title>自动路由拦截（小米PC）</title>
<style>:root{--miclaw-color-text:#1c1f28;--miclaw-color-text-muted:#636878}*{margin:0;padding:0;box-sizing:border-box}body{font-family:"MiSans",-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;font-weight:330;line-height:1.6;color:var(--miclaw-color-text);background:#fff;-webkit-font-smoothing:antialiased;padding:24px 0}.xu-flow{max-width:824px;width:100%;padding:0 12px;margin:0 auto;font-size:16px}.xu-flow-item{margin-top:13px}.xu-user{display:flex;justify-content:flex-end}.xu-user-content{max-width:min(720px,86%);padding:10px 15px;line-height:1.5;border-radius:10px;background:rgba(52,130,255,0.1);color:#000;word-break:break-word}.quota-card{width:100%;max-width:540px;border-radius:20px;background:#fff;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,0.06);border:1px solid rgba(0,0,0,0.04)}.quota-card-body{padding:20px 24px 16px}.quota-card-icon{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#e8f5e9,#c8e6c9);display:flex;align-items:center;justify-content:center;font-size:18px;margin-bottom:12px}.quota-card-title{font-size:15px;font-weight:520;color:var(--miclaw-color-text);margin-bottom:6px}.quota-card-desc{font-size:13px;color:var(--miclaw-color-text-muted);line-height:1.6}.quota-card-footer{display:flex;align-items:center;justify-content:flex-end;gap:8px;height:54px;padding:0 16px;border-top:1px solid rgba(0,0,0,0.06);background:#fafafa}.btn-primary{height:32px;min-width:72px;border-radius:8px;padding:0 16px;font-size:12px;font-weight:500;color:#fff;background:#3482ff;border:none;cursor:pointer}</style>
</head><body>
<div class="xu-flow">
  <div class="xu-flow-item"><div class="xu-user"><div class="xu-user-content">把桌面上的产品数据.xlsx 分析一下，找出销量下降的根因</div></div></div>
  <div class="xu-flow-item">
    <div class="quota-card">
      <div class="quota-card-body">
        <div class="quota-card-icon">🧠</div>
        <div class="quota-card-title">该问题需要专家模式处理</div>
        <div class="quota-card-desc">这个任务需要深度分析能力，但当前积分已耗尽。升级会员即可获取答案。</div>
        <div style="margin-top:8px;font-size:12px;color:var(--miclaw-color-text-muted);">💡 轻量对话（快速模式）仍可正常使用</div>
      </div>
      <div class="quota-card-footer">
        <button class="btn-primary">升级会员</button>
      </div>
    </div>
  </div>
</div>
</body></html>
