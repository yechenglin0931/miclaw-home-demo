<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>PC MiClaw 灵感广场（模态弹窗版）</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#F4F5F9;--surface:#FFF;--hover:rgba(59,130,246,0.06);--border:#E8EAF0;--text:#1A1D26;--textSec:#5F6577;--textTer:#A0A6B8;--accent:#3B82F6;--accentBg:rgba(59,130,246,0.08);--font:-apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,sans-serif;--green:#22C55E;--red:#EF4444;--orange:#F59E0B}
html,body{height:100%}
body{font-family:var(--font);background:#E8EBF0;color:var(--text);-webkit-font-smoothing:antialiased;display:flex;justify-content:center;align-items:flex-start;min-height:100vh;padding:20px}
.win{width:1100px;height:720px;background:var(--bg);border-radius:14px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 24px 80px rgba(0,0,0,0.10),0 0 0 1px rgba(0,0,0,0.04)}
.tbar{height:52px;display:flex;align-items:center;padding:0 20px;flex-shrink:0}
.dots{display:flex;gap:8px}.dot{width:12px;height:12px;border-radius:50%}.d-r{background:#FF5F57}.d-y{background:#FEBC2E}.d-g{background:#28C840}
.body{display:flex;flex:1;min-height:0;padding:0 8px 8px;gap:0}
.sb{width:220px;flex-shrink:0;background:var(--surface);border-radius:18px;display:flex;flex-direction:column;overflow:hidden;margin-right:8px}
.sb-nav{padding:12px 12px 0;display:flex;flex-direction:column;gap:1px}
.sb-btn{width:100%;display:flex;align-items:center;gap:10px;border-radius:10px;padding:9px 12px;font-size:14px;font-weight:500;color:var(--textSec);cursor:pointer;border:none;background:none;text-align:left;transition:all .12s}
.sb-btn:hover{background:rgba(0,0,0,0.03);color:var(--text)}
.sb-btn.on{background:var(--accentBg);color:var(--accent)}
.sb-btn svg{width:18px;height:18px;flex-shrink:0}
.sb-scr{flex:1;overflow-y:auto;padding:12px}
.sb-lbl{font-size:12px;font-weight:500;color:var(--accent);padding:8px 12px 4px}
.sb-h{font-size:13px;padding:7px 12px;border-radius:8px;color:var(--textSec);cursor:pointer;transition:all .12s}
.sb-h:hover{background:rgba(0,0,0,0.03)}
.mc{flex:1;min-width:0;border-radius:18px;background:var(--surface);position:relative;overflow:hidden;display:flex;flex-direction:column}
.insp-scr{flex:1;overflow-y:auto;padding:32px 36px 36px}
.insp-scr::-webkit-scrollbar{width:4px}
.insp-scr::-webkit-scrollbar-thumb{background:rgba(0,0,0,0.06);border-radius:99px}
.insp-badge{display:inline-block;font-size:12px;font-weight:600;color:var(--accent);background:var(--accentBg);padding:4px 12px;border-radius:16px;margin-bottom:10px}
.insp-scr h1{font-size:20px;font-weight:700;color:var(--text);margin-bottom:4px}
.insp-scr .sub{font-size:13.5px;color:var(--textSec);margin-bottom:20px}
.tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.tab{padding:5px 13px;border-radius:16px;font-size:12.5px;font-weight:500;color:var(--textSec);background:var(--surface);border:1px solid var(--border);cursor:pointer;transition:all .15s}
.tab:hover{background:var(--hover);color:var(--text);border-color:rgba(59,130,246,0.2)}
.tab.on{background:var(--accentBg);color:var(--accent);border-color:rgba(59,130,246,0.3)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;cursor:pointer;transition:all .18s;display:flex;flex-direction:column;gap:5px}
.card:hover{border-color:rgba(59,130,246,0.4);box-shadow:0 4px 16px rgba(59,130,246,0.08);transform:translateY(-1px)}
.card-em{font-size:20px;line-height:1}
.card-t{font-size:13.5px;font-weight:600;color:var(--text)}
.card-d{font-size:11.5px;color:var(--textSec);line-height:1.5}
.card-b{display:inline-flex;align-self:flex-start;font-size:10px;font-weight:600;padding:2px 7px;border-radius:5px;margin-top:2px}
.card-b.bl{background:rgba(59,130,246,0.07);color:#2563EB}
.card-b.pu{background:rgba(139,92,246,0.07);color:#7C3AED}
.card-b.gr{background:rgba(22,163,74,0.07);color:#15803D}
.card-b.or{background:rgba(234,88,12,0.07);color:#C2410C}

/* Modal Overlay */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);display:none;align-items:center;justify-content:center;z-index:1000;backdrop-filter:blur(4px)}
.modal-overlay.show{display:flex}
.modal{width:780px;max-height:520px;background:var(--surface);border-radius:20px;box-shadow:0 32px 100px rgba(0,0,0,0.2);display:flex;overflow:hidden;animation:modalIn .25s ease}
@keyframes modalIn{from{opacity:0;transform:scale(0.95) translateY(10px)}to{opacity:1;transform:scale(1) translateY(0)}}

/* Modal Left: Preview */
.modal-left{width:55%;background:#F8F9FB;display:flex;align-items:center;justify-content:center;padding:24px;position:relative}
.modal-left img{max-width:100%;max-height:100%;border-radius:12px;object-fit:cover;box-shadow:0 8px 32px rgba(0,0,0,0.08)}
.modal-left .placeholder{display:flex;flex-direction:column;align-items:center;gap:12px;color:var(--textTer)}
.modal-left .placeholder .emoji{font-size:64px}
.modal-left .placeholder .txt{font-size:13px}

/* Modal Right: Info */
.modal-right{width:45%;padding:28px 24px;display:flex;flex-direction:column;gap:16px;overflow-y:auto}
.modal-right h2{font-size:17px;font-weight:700;color:var(--text);display:flex;align-items:center;gap:8px}
.modal-right h2 .em{font-size:22px}
.modal-section{display:flex;flex-direction:column;gap:8px}
.modal-section label{font-size:11.5px;font-weight:600;color:var(--textTer);text-transform:uppercase;letter-spacing:0.5px}
.prompt-box{font-size:12.5px;color:var(--text);background:#F4F5F9;border-radius:10px;padding:12px;line-height:1.6;max-height:100px;overflow-y:auto;border:1px solid var(--border)}
/* (exec-options styles removed - no longer used) */
.skill-list{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.skill-tag{font-size:10.5px;padding:2px 8px;border-radius:6px;display:flex;align-items:center;gap:3px}
.skill-tag.installed{background:rgba(34,197,94,0.08);color:#16A34A}
.skill-tag.missing{background:rgba(239,68,68,0.08);color:#DC2626}
.skill-tag .install-btn{font-size:10px;color:var(--accent);cursor:pointer;font-weight:600;margin-left:4px;text-decoration:underline}
.modal-footer{margin-top:auto;padding-top:12px}
.try-btn{width:100%;padding:12px;border-radius:12px;border:none;background:var(--accent);color:white;font-size:14px;font-weight:600;cursor:pointer;transition:all .15s}
.try-btn:hover:not(:disabled){background:#2563EB;transform:translateY(-1px)}
.try-btn:disabled{background:#CBD5E1;color:#94A3B8;cursor:not-allowed}
.try-btn-hint{font-size:10.5px;color:var(--textTer);text-align:center;margin-top:6px}
</style>
</head>
<body>
<div class="win">
<div class="tbar"><div class="dots"><div class="dot d-r"></div><div class="dot d-y"></div><div class="dot d-g"></div></div></div>
<div class="body">
<aside class="sb">
<div class="sb-nav">
<button class="sb-btn"><svg width="18" height="18" viewBox="0 0 32 32" fill="currentColor"><path d="M22.104 26.584C20.232 27.688 18.184 28.24 15.96 28.24C13.736 28.24 11.688 27.688 9.816 26.584C7.944 25.496 6.456 24.016 5.352 22.144C4.248 20.272 3.696 18.224 3.696 16C3.696 13.776 4.248 11.728 5.352 9.856C6.456 7.984 7.944 6.496 9.816 5.392C11.688 4.288 13.736 3.736 15.96 3.736C18.184 3.736 20.232 4.288 22.104 5.392C23.976 6.496 25.456 7.984 26.544 9.856C27.648 11.728 28.2 13.776 28.2 16C28.2 18.224 27.648 20.272 26.544 22.144C25.456 24.016 23.976 25.496 22.104 26.584Z"/></svg><span>新建对话</span></button>
<button class="sb-btn"><svg width="18" height="18" viewBox="0 0 32 32" fill="currentColor"><path d="M16 3.7C22.8 3.7 28.3 9.2 28.3 16s-5.5 12.3-12.3 12.3S3.7 22.8 3.7 16 9.2 3.7 16 3.7z"/></svg><span>任务</span></button>
<button class="sb-btn"><svg width="18" height="18" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2"><circle cx="10" cy="11" r="5.5"/><circle cx="23" cy="13" r="3.8"/><circle cx="16" cy="23" r="3"/></svg><span>跨端执行</span></button>
<button class="sb-btn on"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 2l2.4 7.4H22l-6 4.6 2.3 7L12 16.4 5.7 21l2.3-7L2 9.4h7.6z"/></svg><span>灵感广场</span></button>
<button class="sb-btn"><svg width="18" height="18" viewBox="0 0 32 32" fill="currentColor"><path d="M16.5 28.2c-.4.1-.8.1-1.2 0-.2 0-.4-.1-.6-.2l-.5-.3L7 23.7l-.3-.2c-.3-.2-.6-.3-.8-.5-.2-.1-.4-.3-.5-.4-.3-.3-.5-.6-.6-1a3 3 0 01-.1-.8V12.3c0-.4 0-.8.1-1.1 0-.3.1-.6.2-.8.1-.4.3-.7.6-1 .1-.1.3-.3.5-.4.2-.1.5-.3.7-.4l.4-.2 6.7-3.8c.4-.2.7-.4 1-.5.3-.1.5-.2.7-.3.4-.1.8-.1 1.2 0 .2 0 .4.1.7.3.3.1.6.3 1 .5l6.7 3.8.3.2c.3.2.6.3.8.5.2.1.4.3.5.4.3.3.5.7.6 1 .1.2.1.5.1.8v8.5c0 .4 0 .8-.1 1.1 0 .3-.1.6-.2.8-.1.4-.3.7-.6 1-.1.2-.3.3-.5.4-.2.1-.6.3-1.1.6l-6.7 3.8-.4.2c-.2.1-.5.3-.7.4-.2.1-.4.2-.6.2z"/></svg><span>设置</span></button>
</div>
<div class="sb-scr">
<div class="sb-lbl">对话记录</div>
<div class="sb-h">手机板书照片整理笔记</div>
<div class="sb-h">季度PPT生成</div>
<div class="sb-h">给丸子打电话交作业</div>
<div class="sb-h">询问基座模型</div>
<div class="sb-h">三亚5天旅游攻略</div>
</div>
</aside>
<main class="mc">
<div class="insp-scr">
<div class="insp-badge">灵感广场</div>
<h1>探索超级小爱能做什么</h1>

</div>

<div style="width:56px;height:56px;border-radius:14px;background:linear-gradient(135deg,#6366F1,#3B82F6);display:flex;align-items:center;justify-content:center;margin-bottom:12px;box-shadow:0 4px 12px rgba(59,130,246,0.2)"><svg viewBox="0 0 24 24" fill="white" width="30" height="30"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg></div>

<div style="width:26px;height:26px;border-radius:50%;border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--textTer);flex-shrink:0;font-size:16px;cursor:pointer">+</div>
<textarea id="chatTA" rows="1" style="flex:1;border:none;background:none;font-size:14px;color:var(--text);font-family:var(--font);resize:none;outline:none;line-height:1.6;min-height:22px;max-height:120px" placeholder="输入你想做的事情…"></textarea>
<button style="width:30px;height:30px;border-radius:50%;background:var(--accent);border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0"><svg width="14" height="14" viewBox="0 0 24 24" fill="white"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg></button>

<!-- Modal -->

<div class="modal" id="modal">

<script>
const cards = [
  {cat:"create",em:"🖼️",title:"一键证件照",desc:"AI抠图+蓝底合成，全程本地处理",badge:"p-image",badgeCls:"pu",prompt:"帮我制作一张标准一寸证件照，蓝色背景，裁切为295×413px。全程本地处理，不上传云端。",skills:["p-image"],cloud:true,preview:"inspiration-previews/photo_edit_preview.png"},
  {cat:"create",em:"📊",title:"制作 PPT",desc:"输入主题，AI生成完整演示文稿",badge:"pptx",badgeCls:"pu",prompt:"帮我做一份季度工作总结PPT，从我的数据文件和截图中自动生成，包含封面、目录、数据图表、成果展示和下季度规划，风格简洁专业。",skills:["pptx","localSearch"],cloud:true,preview:"inspiration-previews/ppt_preview.png"},
  {cat:"create",em:"🌐",title:"交互式网页",desc:"描述需求，直接生成可运行网页",badge:"frontend",badgeCls:"pu",prompt:"帮我做一个可交互的团队调研问卷网页，包含单选、多选、文本输入，提交后自动把结果保存到Excel，并在本地起服务让我用浏览器打开。",skills:["frontend-design","xlsx"],cloud:true,preview:"inspiration-previews/webpage_preview.png"},
  {cat:"create",em:"🎬",title:"生成短视频",desc:"文字描述内容，AI自动剪辑成片",badge:"video",badgeCls:"pu",prompt:"@手机 把今天拍的旅行视频片段传到电脑上，帮我剪辑成一段15秒的竖版Vlog，配上轻快的背景音乐和字幕，导出到桌面。",skills:["A2A","video-gen"],cloud:true,preview:"inspiration-previews/video_preview.png"},
  {cat:"create",em:"🔍",title:"深度调研",desc:"多源信息采集，输出PDF研究报告",badge:"research",badgeCls:"pu",prompt:"帮我深度调研目前市面上AI PC产品的发展趋势，对比主流方案的技术路线差异，输出一份带数据来源的研究报告，保存为PDF。预计需要30分钟，完成后通知我。",skills:["deep-research","pdf"],cloud:true,preview:null},
  {cat:"doc",em:"📄",title:"智能周报",desc:"扫描本周文档，自动生成周报",badge:"docx",badgeCls:"bl",prompt:"扫描我这周创建和修改过的文档，自动汇总本周完成事项和关键产出，生成一份结构清晰的工作周报，输出为Word文档。",skills:["docx","localSearch"],cloud:false,preview:null},
  {cat:"doc",em:"📋",title:"创建表格",desc:"快速生成结构化Excel表格",badge:"xlsx",badgeCls:"bl",prompt:"帮我创建一个项目排期表格，包含任务名称、负责人、开始日期、截止日期、进度状态，先填入5条示例数据，保存为Excel。",skills:["xlsx"],cloud:false,preview:null},
  {cat:"doc",em:"📑",title:"合同风险扫描",desc:"提取关键条款，高亮风险点",badge:"pdf",badgeCls:"bl",prompt:"帮我阅读一份合同PDF，提取关键条款（金额、周期、违约责任、知识产权），高亮潜在风险点，输出一份风险摘要。",skills:["pdf","localSearch"],cloud:false,preview:null},
  {cat:"tool",em:"📰",title:"每日科技简报",desc:"定时抓取+摘要，推送到手机",badge:"schedule",badgeCls:"gr",prompt:"帮我创建一个后台任务：每天早上9点自动抓取科技媒体的热门文章，生成一份科技日报，并推送摘要到我手机。",skills:["scheduledTask","playwright","A2A"],cloud:false,preview:null},
  {cat:"tool",em:"💰",title:"价格监控",desc:"实时监控降价，手机通知你",badge:"monitor",badgeCls:"gr",prompt:"帮我监控一个商品的价格走势，一旦降到我设定的目标价以下，立刻通知我的手机。",skills:["scheduledTask","playwright","A2A"],cloud:false,preview:null},
  {cat:"tool",em:"🧩",title:"创建新技能",desc:"教 MiClaw 学会新本领",badge:"skill",badgeCls:"gr",prompt:"帮我创建一个Skill：每次我说\"会议纪要\"的时候，自动录音转文字，提取待办事项，生成纪要文档，同时把待办发到手机提醒。",skills:["skill-creator","A2A"],cloud:false,preview:null},
  {cat:"device",em:"📸",title:"白板变PPT",desc:"手机拍照→电脑自动生成课件",badge:"跨端",badgeCls:"or",prompt:"@手机 帮我拍一张会议室白板的照片传过来，识别上面的内容结构，在电脑上自动生成一份对应的PPT框架。",skills:["A2A","OCR","pptx"],cloud:true,preview:null},
  {cat:"device",em:"🏠",title:"回家场景联动",desc:"一句话控制灯光+空调+文件同步",badge:"IoT",badgeCls:"or",prompt:"我到家了。帮我把客厅灯打开调到暖光模式，空调设置26度，然后把我手机上还没看完的那篇文章同步到电脑上继续看。",skills:["xiaomihome","A2A"],cloud:false,preview:null},
];

// Simulate installed skills
const installedSkills = new Set(["pptx","localSearch","xlsx","docx","pdf","bash","A2A","frontend-design","scheduledTask","playwright","skill-creator","xiaomihome","OCR"]);
// These are NOT installed to demo the flow:
// "p-image", "video-gen", "deep-research", "seedream"

function renderCards(){
  const grid = document.getElementById('cardGrid');
  grid.innerHTML = cards.map((c,i)=>`
    <div class="card" data-idx="${i}" data-c="${c.cat}">
      <div class="card-em">${c.em}</div>
      <div class="card-t">${c.title}</div>
      <div class="card-d">${c.desc}</div>
      <div class="card-b ${c.badgeCls}">${c.badge}</div>
    </div>
  `).join('');
}

function openModal(idx){
  const c = cards[idx];
  const overlay = document.getElementById('modalOverlay');
  const left = document.getElementById('modalLeft');
  const right = document.getElementById('modalRight');
  
  // Left: preview
  if(c.preview){
    left.innerHTML = `<img src="${c.preview}" alt="效果预览"/>`;
  } else {
    left.innerHTML = `<div class="placeholder"><div class="emoji">${c.em}</div><div class="txt">效果预览图（待补充）</div></div>`;
  }
  
  // Right: info (simplified - no execution mode selection)
  const hasSkillDep = c.skills && c.skills.length > 0;
  
  let skillsHtml = '';
  if(hasSkillDep){
    skillsHtml = `<div class="skill-list">${c.skills.map(s => 
      installedSkills.has(s) 
        ? `<span class="skill-tag installed">✓ ${s}</span>`
        : `<span class="skill-tag missing">⏳ ${s}</span>`
    ).join('')}</div>`;
  }
  
  const missingSkills = c.skills ? c.skills.filter(s => !installedSkills.has(s)) : [];
  const envHint = missingSkills.length > 0 
    ? `<div class="try-btn-hint">缺少的依赖将在执行时自动安装</div>`
    : hasSkillDep ? `<div class="try-btn-hint" style="color:var(--green)">所有依赖已就绪</div>` : '';
  
  right.innerHTML = `
    <h2><span class="em">${c.em}</span>${c.title}</h2>
    <div class="modal-section">
      <label>📝 Prompt</label>
      <div class="prompt-box">${c.prompt}</div>
    </div>
    ${hasSkillDep ? `
    <div class="modal-section">
      <label>🧩 能力依赖</label>
      ${skillsHtml}
    </div>` : ''}
    <div class="modal-footer">
      <button class="try-btn" onclick="tryIt(${idx})">试一试</button>
      ${envHint}
    </div>
  `;
  
  overlay.classList.add('show');
  window._currentCard = idx;
}

function tryIt(idx){
  const c = cards[idx];
  document.getElementById('modalOverlay').classList.remove('show');
  // 直接切到对话视图，预填prompt
  document.querySelector('.insp-scr').style.display = 'none';
  document.getElementById('chatView').style.display = 'flex';
  document.getElementById('chatTA').value = c.prompt;
  const ta = document.getElementById('chatTA');
  ta.style.height = 'auto';
  ta.style.height = Math.min(ta.scrollHeight, 120) + 'px';
  ta.focus();
  // 侧边栏高亮切换
  document.querySelectorAll('.sb-btn').forEach(b => b.classList.remove('on'));
  document.querySelectorAll('.sb-btn')[0].classList.add('on');
}

// Close modal on overlay click
document.getElementById('modalOverlay').addEventListener('click', function(e){
  if(e.target === this) this.classList.remove('show');
});
document.addEventListener('keydown', function(e){
  if(e.key === 'Escape') document.getElementById('modalOverlay').classList.remove('show');
});

// Tab filtering
document.querySelectorAll('.tab').forEach(t => {
  t.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('on'));
    t.classList.add('on');
    const c = t.dataset.c;
    document.querySelectorAll('.card').forEach(card => {
      card.style.display = (c === 'all' || card.dataset.c === c) ? '' : 'none';
    });
  });
});

// Card click → open modal
document.getElementById('cardGrid').addEventListener('click', function(e){
  const card = e.target.closest('.card');
  if(card) openModal(parseInt(card.dataset.idx));
});

renderCards();
</script>
</body>
</html>
