<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>三方PC — 降级基础模式</title>
<style>
:root { --text: #1c1f28; --text-muted: #636878; --accent: #3482ff; --border: #e9ebf0; }
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'MiSans', -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif; font-weight: 330; line-height: 1.6; color: var(--text); background: #fff; -webkit-font-smoothing: antialiased; padding: 32px; }
.scene-label { text-align: center; padding: 8px; font-size: 11px; color: rgba(0,0,0,0.35); background: rgba(0,0,0,0.02); border-radius: 6px; margin-bottom: 16px; margin-top: 24px; }
.scene-label:first-child { margin-top: 0; }

body { background: #fff; padding: 0; max-width: 700px; margin: 0 auto; }
.degraded-banner { display: flex; align-items: center; gap: 8px; padding: 8px 24px; background: rgba(52,130,255,0.03); border-bottom: 1px solid rgba(52,130,255,0.08); font-size: 12px; color: var(--text-muted); }
.degraded-badge { padding: 2px 8px; border-radius: 4px; background: rgba(52,130,255,0.1); color: var(--accent); font-size: 11px; font-weight: 500; }
.degraded-upgrade { margin-left: auto; color: var(--accent); font-size: 12px; font-weight: 500; cursor: pointer; }
.chat { padding: 24px; }
.user { display: flex; justify-content: flex-end; margin-bottom: 16px; }
.user-bubble { padding: 10px 15px; border-radius: 10px; background: rgba(52,130,255,0.1); font-size: 16px; max-width: 80%; }
.answer { padding: 10px 15px; border-radius: 10px; font-size: 16px; color: rgba(0,0,0,0.88); margin-bottom: 16px; }
.block-card { max-width: 480px; border-radius: 16px; background: #fff; overflow: hidden; box-shadow: 0 2px 12px rgba(0,0,0,0.06); border: 1px solid rgba(0,0,0,0.04); }
.block-card-body { padding: 14px 18px; }
.block-card-footer { display: flex; align-items: center; justify-content: flex-end; height: 50px; padding: 0 16px; border-top: 1px solid rgba(0,0,0,0.06); background: #fafafa; }
.btn-primary { height: 32px; border-radius: 8px; padding: 0 16px; font-size: 12px; font-weight: 500; color: #fff; background: var(--accent); border: none; cursor: pointer; }
.input-area { padding: 12px 24px 16px; border-top: 1px solid rgba(0,0,0,0.04); }
.input-box { display: flex; align-items: center; padding: 12px 16px; border-radius: 12px; border: 1px solid #e0e5ec; font-size: 14px; color: rgba(0,0,0,0.35); }
</style></head><body>
<div class="degraded-banner">
  <span class="degraded-badge">基础模式</span>
  <span>积分已用完，当前为基础模式。深度思考、专家模式等高级功能暂不可用</span>
  <span class="degraded-upgrade">升级解锁 →</span>
</div>
<div class="chat">
  <div class="user"><div class="user-bubble">今天天气怎么样</div></div>
  <div class="answer">今天北京晴，气温 28°C~35°C，适合出行。建议做好防晒。</div>
  <div class="user"><div class="user-bubble">帮我深度分析一下公司财报</div></div>
  <div class="block-card">
    <div class="block-card-body">
      <div style="display:flex;align-items:center;gap:8px"><span style="font-size:14px">🔒</span><span style="font-size:13px;font-weight:520">该功能消耗积分，当前积分不足</span></div>
      <div style="font-size:12px;color:#636878;margin-top:6px;margin-left:22px">深度思考为高级功能，需要消耗积分才能使用。升级会员即可解锁。<br>基础问答不消耗积分，今日剩余 22 次（每日上限 30 次，次日 0 点重置）。</div>
    </div>
    <div class="block-card-footer"><button class="btn-primary">升级标准会员 · ¥39/月</button></div>
  </div>
</div>
<div class="input-area"><div class="input-box">输入消息（基础模式）...</div></div>
</body></html>
